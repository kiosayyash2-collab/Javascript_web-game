 // take the player choice
   let player_choice;

  }
  
  //paper choice

  console.log("player choice : ",player_choice)

     computer_choice == "rock";

 //evaluate the result
 document.getElementById("opponent").onanimationstart = function(){

    let result;


    if (player_choice == computer_choice){
      result = "draw";
    }

     result ="papper";

    }

 }
